<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Clipper</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="app">
  <h1>✂ AI Clipper</h1>
  <p>Turn your videos into clips</p>

  <section>
    <h2>Option 1: Gallery Upload</h2>

    <label for="video">Choose your video</label>
    <input type="file" id="video" accept="video/*">

    <button id="create">Create Clip from Gallery</button>
  </section>

  <section>
    <h2>Option 2: Direct MP4 Link</h2>

    <label for="videoUrl">Paste direct MP4 video link</label>
    <input
      type="url"
      id="videoUrl"
      placeholder="https://example.com/video.mp4"
    >

    <button id="createFromUrl">Create Clip from Link</button>
  </section>

  <section>
    <h2>Clip Timing</h2>

    <label for="start">Start time (seconds)</label>
    <input type="number" id="start" value="0" min="0">

    <label for="end">End time (seconds)</label>
    <input type="number" id="end" value="30" min="1">
  </section>

  <p id="message" aria-live="polite">
    Your clip will be ready here.
  </p>
</main>

<script src="app.js"></script>
</body>
</html>
