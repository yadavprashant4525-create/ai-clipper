<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Clipper</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
<h1>✂ AI Clipper</h1>
<p>Turn your videos into clips</p>

<label>Choose your video</label>
<input type="file" id="video" accept="video/*">

<label>Start time (seconds)</label>
<input type="number" id="start" value="0">

<label>End time (seconds)</label>
<input type="number" id="end" value="30">

<button id="create">Create Clip</button>
<p id="message">Your clip will be ready here.</p>
</main>
<script src="app.js"></script>
</body>
</html>
